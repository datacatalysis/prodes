name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per commit. A branch with an open pull request is already covered by
# the pull_request trigger, so the push trigger is limited to main to stop every
# commit building twice.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Read-only unless a job asks for more. Only the tag job does, and only on main.
permissions:
  contents: read

jobs:
  test:
    name: Unit tests (Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v5

      - name: Set up conda environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true
          cache-downloads: true

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Show environment
        run: |
          python --version
          pytest --version

      - name: Run unit tests
        run: pytest tests --tb=short -v

  lint:
    name: Lint (pre-commit + mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v5

      - name: Set up conda environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true
          cache-downloads: true

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Run pre-commit hooks
        # Every hook in .pre-commit-config.yaml, over every file: black, ruff and
        # mypy, and also the whitespace fixers, the large-file guard and the
        # blocked-extension hooks. A contributor who never ran `pre-commit install`
        # is caught here rather than not at all. The opt-in ggshield config is not
        # read here; secrets are scanned by gitguardian.yml.
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Run mypy against the installed dependencies
        # The pre-commit mypy hook runs in an isolated environment that has none of
        # the runtime packages or pandas-stubs, so it cannot see their types. This
        # run uses the conda environment and the pinned mypy from the dev extras.
        run: mypy src

  version:
    # Every pull request has to declare a version above the version already
    # released. A rebase onto a main that has moved needs the version raised
    # again, and nothing says so: both sides then hold the same version string,
    # git reports no conflict, and the bump made at the start of the work quietly
    # stops being a bump. This job reports that while the branch can still be
    # fixed. The tag job below cannot: by the time it runs the duplicate is
    # already on main, and declining to move a published tag is the right thing
    # for it to do.
    name: Version above main and every tag
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5
        with:
          # The base branch and the tags are what the version is compared against,
          # and actions/checkout fetches neither by default.
          fetch-depth: 0

      - name: Check the version is above the base branch and every tag
        # Standard library only, so this needs neither the conda environment nor
        # an install, and reports in seconds rather than after the test job.
        env:
          # Passed as an environment variable rather than interpolated into the
          # command, so that a branch name is data and cannot become part of the
          # command. This matters more here than in a private repository: anyone
          # can open a pull request from a fork, with a branch name of their choice.
          BASE_REF: ${{ github.base_ref }}
        run: python3 .github/scripts/check_version_bumped.py --base "$BASE_REF" --fetch

  tag:
    # Tag the version that has just reached main, so that every released version
    # is findable in git and on the Releases page. The bump is made in the same
    # pull request as the change; creating the tag by hand afterwards is a
    # separate act that nothing forces, and versions 8.0.0 and 9.0.0 of this
    # repository have no tag.
    #
    # needs: test and lint, so a version never gets a tag unless the build that
    # carried it was green.
    name: Tag and release the declared version
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 5
    permissions:
      # Requested here rather than relying on the repository default, so this job
      # keeps working whatever the default is set to later, and no other job gets it.
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          # Tags are needed to answer "does this version already have one", and
          # actions/checkout fetches none by default.
          fetch-depth: 0

      - name: Tag the declared version
        id: tag
        # pyproject.toml is the single declaration of the version, and
        # prodes_run.json records the installed package version, so the tag and
        # the version written into an output bundle cannot disagree.
        #
        # A push to main that does not change the version must be a no-op, not a
        # failure, so an existing tag exits 0. That also makes a re-run of this
        # workflow harmless.
        #
        # The tag is pushed with the default GITHUB_TOKEN, which deliberately does
        # not start another workflow run, so this cannot loop.
        run: |
          set -euo pipefail
          version=$(python3 -c "
          import pathlib, tomllib
          print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])
          ")
          if [ -z "$version" ]; then
            echo "No version found in pyproject.toml." >&2
            exit 1
          fi
          # A bare version, no v prefix, matching every tag this repository already has.
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$'; then
            echo "Version '$version' is not a version number; refusing to tag." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "Version $version is already tagged; nothing to do."
            echo "tagged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$version" -m "$version"
          git push origin "$version"
          echo "tagged=true" >> "$GITHUB_OUTPUT"
          echo "Tagged $version at $(git rev-parse --short HEAD)."

      - name: Publish the GitHub Release for that tag
        if: steps.tag.outputs.tagged == 'true'
        # --generate-notes fills the body with the merged pull requests since the
        # previous tag. When a version changes feature values, which this
        # repository treats as a major bump, edit the Release afterwards and put
        # a curated note at the top, above the generated list. Editing a Release
        # changes no file and needs no pull request.
        #
        # --verify-tag refuses to invent a tag if the push above did not land, so
        # a Release can never point at a commit that was never tagged.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; leaving it alone."
            exit 0
          fi
          gh release create "$VERSION" --title "$VERSION" --generate-notes --verify-tag
          echo "Published the GitHub Release for $VERSION."
