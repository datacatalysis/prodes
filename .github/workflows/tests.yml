name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per commit. A branch with an open pull request is already covered by
# the pull_request trigger, so the push trigger is limited to main to stop every
# commit building twice.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests (Python 3.13)
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v5

      - name: Set up conda environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true
          cache-downloads: true

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Show environment
        run: |
          python --version
          pytest --version

      - name: Run unit tests
        run: pytest tests --tb=short -v

  lint:
    name: Lint (ruff + black + mypy)
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v5

      - name: Set up conda environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true
          cache-downloads: true

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Run ruff
        run: ruff check src tests scripts

      - name: Run black
        run: black --check src tests scripts

      - name: Run mypy
        run: mypy src
