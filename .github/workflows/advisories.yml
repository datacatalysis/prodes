name: Advisories

# Reports, once a week, the published security advisories for the pinned
# dependencies. Every dependency is pinned exactly, so the risk is a pinned version
# going stale rather than an unexpected upgrade, and nothing else looks.
#
# This workflow changes nothing. A finding fails the run, and GitHub notifies on a
# failed scheduled run; the fix is an ordinary pull request that moves the pin in
# pyproject.toml, environment.yml and environment_dev.yml together. Dependabot
# (.github/dependabot.yml) proposes the GitHub Actions bumps as pull requests.
on:
  schedule:
    # Mondays, 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    # Audits the installed environment rather than the list of pins. The list leaves
    # out every transitive package, which is where most advisories land. This is the
    # environment the test job in tests.yml builds, development tools included.
    name: Audit the installed Python packages
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v5

      - name: Set up conda environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true
          cache-downloads: true

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Audit the installed Python packages
        # OSV rather than the PyPI advisory feed: it also covers packages installed
        # by conda. --skip-editable leaves out prodes itself, which is not on PyPI.
        run: |
          pip install pip-audit==2.9.0
          pip-audit --vulnerability-service osv --skip-editable
