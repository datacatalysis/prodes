# Proposes updates as pull requests. Nothing is changed until one is reviewed and
# merged, which is what keeps every pin exact. Python packages are not listed: each
# pin is mirrored in pyproject.toml, environment.yml and environment_dev.yml, and
# tests/test_dependency_versions.py holds them in step, which a Dependabot pull
# request touching pyproject.toml alone would break. .github/workflows/advisories.yml
# reports their advisories instead.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
