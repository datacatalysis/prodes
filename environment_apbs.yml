# Environment for the Prodes against APBS electrostatics comparison.
# Binaries only: the analysis code runs in the `prodes` env (it imports Prodes)
# and shells out to `apbs` and `pdb2pqr` from here by absolute path.
#
# python is pinned below 3.14 deliberately. propka 3.5.1 reads instance
# __annotations__, and PEP 649 removed the fallback that made that work, so
# `pdb2pqr --titration-state-method=propka` crashes on every structure under a
# 3.14 solve. Conda will pick 3.14 if you let it.
name: prodes-apbs
channels:
  - conda-forge
dependencies:
  - python=3.12.13
  - apbs=3.4.1
  - pdb2pqr=3.6.1     # 3.6.1 installs a plain `pdb2pqr` script; earlier 3.x only pdb2pqr30
  - propka=3.5.1
  - numpy=2.5.2
  - scipy=1.18.0
  - pandas=3.0.5
  - matplotlib-base=3.11.1
