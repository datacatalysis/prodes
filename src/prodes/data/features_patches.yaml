# This file is the single source of truth for which patch features Prodes writes;
# prodes.feature_dictionary reads its feature codes and order from here.
# Maintained by hand: edit this file to add, drop or re-describe a patch feature.
meta:
  title: Prodes surface patch features
  description: The features written when the patch step is switched on, in output order. With a residue set NAME, every code is written a second time with _NAME appended, restricted to that set, preceded by SurfArea_NAME.
  feature_count: 11
  written_when: --patches / patches=PatchSettings(...)
  method: docs/surface_patches.md
  default_settings:
    radius_A: 5.0
    min_area_A2: 100.0
    hydrophobic_threshold: 0.0
    ep_threshold_volts: 0.5
  conventions:
    local_value: The local value of a surface point is the area-weighted mean of the per-point value over every surface point within the radius, the point itself included.
    patch: A patch is a set of surface points whose local value passes the threshold and which touch on the 1 A surface lattice. Patches smaller than the minimum area are discarded, judged on the whole patch.
    area: Area is solvent accessible surface area with the 1.4 A probe, in A^2, which is larger than a molecular surface area of the same region.
    residue_set: Patches are found on the whole surface. A restricted column counts only the area of patch points owned by a residue in the set. NSurf*Patch_NAME counts the kept patches with at least one point in the set; *PatchMaxArea_NAME is the largest in-set share of any one patch.
  fields:
    plot_name: Short label for an axis or legend.
    short_explanation: One-line description of what the feature is.
    long_explanation: How the feature is calculated and how to read it.
    original_explanation: Always null; these features were added after Neijenhuis et al. 2024.
    unit: Unit of measurement. Null when the feature is a count or dimensionless.
features:
  SurfMhpPatchArea:
    plot_name: Hydrophobic patch area (A^2)
    short_explanation: Summed area of the hydrophobic surface patches.
    long_explanation: Surface points whose local projected hydrophobicity is above the hydrophobic threshold are linked into patches where they touch; patches under the minimum area are discarded and the area of the rest is summed. Measures how much of the surface is covered by contiguous hydrophobic regions rather than by scattered hydrophobic points.
    unit: Å²
    original_explanation: null
  SurfMhpPatchMaxArea:
    plot_name: Largest hydrophobic patch (A^2)
    short_explanation: Area of the largest hydrophobic surface patch.
    long_explanation: The area of the single largest patch counted in SurfMhpPatchArea. 0 when no patch reaches the minimum area.
    unit: Å²
    original_explanation: null
  NSurfMhpPatch:
    plot_name: Number of hydrophobic patches
    short_explanation: Number of hydrophobic surface patches at or above the minimum area.
    long_explanation: The number of patches counted in SurfMhpPatchArea.
    unit: null
    original_explanation: null
  SurfMhpLocalMax:
    plot_name: Max local MHP
    short_explanation: Highest local projected hydrophobicity on the surface.
    long_explanation: The maximum over surface points of the projected hydrophobicity averaged over the neighbourhood radius, in the units of the hydrophobicity scale. The per-point value is dominated by the nearest one or two atoms, so the average is what gives it the length scale of a surface region; this is the most hydrophobic such region.
    unit: null
    original_explanation: null
  SurfMhpLocalPosSum:
    plot_name: Summed positive local MHP
    short_explanation: Area-weighted sum of the positive part of the local projected hydrophobicity.
    long_explanation: The sum over surface points of the point area times the local projected hydrophobicity where that is positive, zero elsewhere. Combines how hydrophobic and how large the hydrophobic regions are, without a threshold or a minimum patch area. The unit is square angstrom times the units of the hydrophobicity scale, so values from different scales are not comparable. On a scale with no negative values every point contributes.
    unit: Å²
    original_explanation: null
  SurfEpPosPatchArea:
    plot_name: Positive patch area (A^2)
    short_explanation: Summed area of the positive electrostatic surface patches.
    long_explanation: As SurfMhpPatchArea, for points whose local formal-charge electrostatic potential is above the electrostatic threshold.
    unit: Å²
    original_explanation: null
  SurfEpPosPatchMaxArea:
    plot_name: Largest positive patch (A^2)
    short_explanation: Area of the largest positive electrostatic surface patch.
    long_explanation: The area of the single largest patch counted in SurfEpPosPatchArea.
    unit: Å²
    original_explanation: null
  NSurfEpPosPatch:
    plot_name: Number of positive patches
    short_explanation: Number of positive electrostatic surface patches at or above the minimum area.
    long_explanation: The number of patches counted in SurfEpPosPatchArea.
    unit: null
    original_explanation: null
  SurfEpNegPatchArea:
    plot_name: Negative patch area (A^2)
    short_explanation: Summed area of the negative electrostatic surface patches.
    long_explanation: As SurfMhpPatchArea, for points whose local formal-charge electrostatic potential is below the negative of the electrostatic threshold.
    unit: Å²
    original_explanation: null
  SurfEpNegPatchMaxArea:
    plot_name: Largest negative patch (A^2)
    short_explanation: Area of the largest negative electrostatic surface patch.
    long_explanation: The area of the single largest patch counted in SurfEpNegPatchArea.
    unit: Å²
    original_explanation: null
  NSurfEpNegPatch:
    plot_name: Number of negative patches
    short_explanation: Number of negative electrostatic surface patches at or above the minimum area.
    long_explanation: The number of patches counted in SurfEpNegPatchArea.
    unit: null
    original_explanation: null
residue_set_only_features:
  SurfArea:
    plot_name: Surface area of the set (A^2)
    short_explanation: Solvent accessible surface area owned by the residues of the set.
    long_explanation: The summed area of the surface points whose residue is in the set. Written only as SurfArea_NAME, first among the columns of each set, so that the restricted patch areas can be normalised by the size of the region.
    unit: Å²
    original_explanation: null
